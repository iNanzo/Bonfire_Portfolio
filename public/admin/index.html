<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Newton Hoang</title>
    <!-- Where the admin Worker lives (see "Admin panel" in docs/admin.md). -->
    <meta name="admin-url" content="https://nhoang-admin.newtonhoang99.workers.dev/" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07070b; color: #e9e3d2; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 440px; padding: 24px; text-align: center; }
      a { color: #ffc76a; }
    </style>
  </head>
  <body>
    <main>
      <p id="msg">Opening the admin panel…</p>
    </main>
    <script>
      const url = document.querySelector('meta[name="admin-url"]').content;
      if (/YOUR-SUBDOMAIN/.test(url)) {
        document.getElementById('msg').textContent = 'The admin panel isn’t deployed yet. See “Admin panel” in docs/admin.md.';
      } else {
        location.replace(url);
      }
    </script>
  </body>
</html>
