name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing deploys unless the code lints, type-checks, every test passes and the built
  # site loads in a real browser (e2e/: every screen, Bonfire Live, the Painter, no errors).
  ci:
    uses: ./.github/workflows/ci.yml

  # Ships the build the browser tests ran against (ci.yml's `site-dist`), not a second one.
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
