name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nothing deploys unless the code lints, type-checks, every test passes and the built
      # site loads in a real browser (e2e/: every screen and Bonfire Live, no errors).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run admin:test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
