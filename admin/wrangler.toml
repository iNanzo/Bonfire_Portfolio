# The admin panel Worker. deploy-admin.yml updates it after current main passes its existing CI.
# Manual fallback: `npm run admin:deploy` (builds the page first).
# One-time setup (Cloudflare Access, GitHub App, secrets): "Put it online" in docs/admin.md.
name = "nhoang-admin"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# The built admin page (npm run admin:build). run_worker_first: the Worker checks
# the Access sign-in before serving anything, the page included.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
SITE_URL = "https://nhoang.dev/"
GITHUB_OWNER = "iNanzo"
GITHUB_REPO = "Bonfire_Portfolio"
GITHUB_BRANCH = "main"
# From Cloudflare Zero Trust → Access → Applications → (the admin app):
ACCESS_TEAM_DOMAIN = "https://delicate-hall-8962.cloudflareaccess.com"
ACCESS_AUD = "89ec24618d6074cdc937e0b778b2c3d18bd2ae2aabd4e9757c8fe6105ebd8492"

# Secrets (set with `npx wrangler secret put NAME --config admin/wrangler.toml`, never committed):
#   ALLOWED_EMAILS            comma-separated Gmail addresses that may edit
#   GITHUB_APP_ID             the GitHub App's id
#   GITHUB_APP_INSTALLATION_ID
#   GITHUB_APP_PRIVATE_KEY    the app's .pem private key (paste the whole file)
#   (or GITHUB_TOKEN          a fine-grained token for this repo: Contents read/write, Actions read)
